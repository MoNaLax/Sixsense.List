<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIXSENSE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/home.css">
</head>
<body>
  <div class="bg-layer" id="bg-layer"></div>
  <div class="noise"></div>


  <!-- SOCIAL FLOAT -->
  <div class="social-float" id="social-float"></div>

  <!-- MAIN CONTENT -->
  <div class="content">
    <main class="home-main">

      <!-- GANG NAME -->
      <div class="gang-name-wrap">
        <h1 class="gang-name glitch" id="gang-name" data-text="SIXSENSE">SIXSENSE</h1>
        <div class="cyber-line" style="max-width:400px;margin:12px auto;"></div>
      </div>

      <!-- PARTNERS -->
      <div class="partners-row" id="partners-row"></div>

      <!-- LOGO FRAME -->
      <div class="logo-frame-wrap">
        <div class="logo-frame glass-card" id="logo-frame">
          <div class="logo-hex">
            <div class="logo-inner" id="logo-inner">
              <div class="logo-placeholder">⬡</div>
            </div>
          </div>
          <div class="frame-glow frame-glow-1"></div>
          <div class="frame-glow frame-glow-2"></div>
          <div class="scan-line"></div>
        </div>
      </div>

      <!-- CTA -->
      <div class="cta-area">
        <a href="/members" class="btn btn-primary btn-enter">
          <span><i class="fas fa-bolt"></i></span>
          <span>ENTER MEMBERS</span>
          <span><i class="fas fa-arrow-right"></i></span>
        </a>
        <p class="powered-by">POWERED BY <span>SIXSENSE</span></p>
      </div>

    </main>
  </div>

  <!-- MUSIC PLAYER -->
  <div class="music-player" id="music-player"></div>

  <!-- AD MODAL will be injected by JS -->

  <script src="/js/shared.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
