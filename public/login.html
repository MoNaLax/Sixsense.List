<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIXSENSE – Admin Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #030712, #0a0f1e);
    }

    .login-container {
      background: rgba(15, 20, 40, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 200, 255, 0.3);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 50px rgba(0, 150, 255, 0.2);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      font-size: 2.5rem;
      color: #00d4ff;
      margin: 0;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
      font-weight: bold;
    }

    .login-header p {
      color: #00d4ff;
      font-size: 0.9rem;
      margin-top: 8px;
      opacity: 0.8;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #00d4ff;
      font-size: 0.9rem;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0, 212, 255, 0.4);
      border-radius: 6px;
      background: rgba(0, 212, 255, 0.05);
      color: #00d4ff;
      font-size: 1rem;
      transition: all 0.3s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
      background: rgba(0, 212, 255, 0.1);
    }

    .form-group input::placeholder {
      color: rgba(0, 212, 255, 0.4);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0066ff, #00d4ff);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
    }

    .login-btn:hover {
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.6);
      transform: translateY(-2px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      color: #ff4444;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 15px;
      display: none;
    }

    .loading {
      display: none;
    }

    .cyber-line-short {
      height: 2px;
      background: linear-gradient(90deg, transparent, #00d4ff, transparent);
      margin: 20px 0;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: rgba(0, 212, 255, 0.6);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .back-link:hover {
      color: #00d4ff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="bg-layer" id="bg-layer" style="background-image:linear-gradient(135deg,#030712,#0a0f1e)"></div>
  <div class="noise"></div>

  <div class="login-container">
    <div class="login-header">
      <h1>SIXSENSE</h1>
      <p>ADMIN PANEL</p>
    </div>

    <div class="cyber-line-short"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้</label>
        <input type="text" id="username" required placeholder="admin">
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="login-btn">
        <span class="text">เข้าสู่ระบบ</span>
        <span class="loading"><i class="fas fa-spinner fa-spin"></i></span>
      </button>

      <div class="error-msg" id="error-msg"></div>
    </form>

    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> กลับหน้าแรก</a>
  </div>

  <script>
    async function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const loginBtn = document.querySelector('.login-btn');

      errorMsg.style.display = 'none';
      loginBtn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/admin';
        } else {
          errorMsg.textContent = data.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
          errorMsg.style.display = 'block';
          loginBtn.disabled = false;
        }
      } catch (err) {
        errorMsg.textContent = 'เกิดข้อผิดพลาด กรุณาลองอีกครั้ง';
        errorMsg.style.display = 'block';
        loginBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
